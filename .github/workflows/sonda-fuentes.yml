# Sonda temporal (Fase 0): ¿llegan los servidores de GitHub a las fuentes oficiales?
# Solo lee; no escribe nada en el repo. Se reemplaza por datos.yml en la Fase 0.
name: sonda-fuentes
on:
  workflow_dispatch:
  push:
    branches: [fase0-tuberia]
    paths: [".github/workflows/sonda-fuentes.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probar acceso a las fuentes
        shell: bash
        run: |
          set -u
          fallas=0
          probar () {
            nombre="$1"; url="$2"
            salida=$(curl -sS -m 60 --retry 2 -o cuerpo.bin -w "%{http_code} %{size_download} %{time_total} %{remote_ip}" "$url") || salida="ERROR $?"
            codigo=${salida%% *}
            echo "$nombre | $salida | sha256 $(sha256sum cuerpo.bin 2>/dev/null | cut -c1-16) | $url"
            echo "  inicio: $(head -c 160 cuerpo.bin 2>/dev/null | tr '\n' ' ')"
            [ "$codigo" = "200" ] || fallas=$((fallas+1))
          }
          probar "TRM datos.gov.co"      'https://www.datos.gov.co/resource/32sa-8pi3.json?$order=vigenciadesde%20DESC&$limit=1'
          probar "Cartera SFC rvii-eis8" 'https://www.datos.gov.co/resource/rvii-eis8.json?$limit=1'
          probar "BanRep portal suameca" 'https://suameca.banrep.gov.co/estadisticas-economicas/informacionSerie/59/tasas_interes_politica_monetaria'
          probar "BanRep serie 59 (REST del portal)" 'https://suameca.banrep.gov.co/estadisticas-economicas-back/rest/estadisticaEconomicaRestService/consultaInformacionSerie?idSerie=59'
          echo "Fuentes que no respondieron 200: $fallas"
          [ "$fallas" -eq 0 ]
